name: duo-portfolio

services:
  db:
    image: postgres:16-alpine
    container_name: duo-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio}
      POSTGRES_DB: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${DOCKER_IMAGE:-duo-portfolio:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duo-portfolio-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://portfolio:${DB_PASSWORD:-portfolio}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8080'

  proxy:
    build:
      context: ./docker
      dockerfile: Dockerfile.nginx
    container_name: duo-portfolio-proxy
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    depends_on:
      - app

volumes:
  pgdata:
