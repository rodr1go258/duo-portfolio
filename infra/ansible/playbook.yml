---
# Alternativa a scripts/setup_vm.sh (requerimiento "SCRIPT.SH o ANSIBLE").
# Uso: ansible-playbook -i "IP," -u ubuntu --become playbook.yml
- name: Configurar VM Ubuntu 24.04 para el portafolio
  hosts: all
  become: true
  vars:
    vnc_password: duoportfolio

  tasks:
    - name: Instalar dependencias base
      ansible.builtin.apt:
        name: [ca-certificates, curl, git, gnupg, ufw, iptables, openssl]
        state: present
        update_cache: true

    - name: Añadir repositorio de Docker
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Instalar Docker
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Habilitar Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Firewall - permitir 22, 80, 443 y 5901
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
      loop: [22, 80, 443, 5901]
      ignore_errors: true

    - name: UFW - reglas
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      loop: [22, 80, 443, 5901]
      ignore_errors: true

    - name: Habilitar UFW
      ansible.builtin.command: ufw --force enable
      ignore_errors: true

    - name: Crear directorio de despliegue
      ansible.builtin.file:
        path: /opt/portfolio
        state: directory
        owner: ubuntu
        group: ubuntu
